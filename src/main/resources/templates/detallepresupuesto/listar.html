<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Detalles</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1 th:text="${titulo}">Listado de Detalles</h1>
            <div>
                <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
                <a class="btn btn-primary" th:href="@{/detallepresupuesto/form}">Nuevo Detalle</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Presupuesto</th>
                    <th>Material</th>
                    <th>Stock</th>
                    <th>Subtotal</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="detalle : ${detalles}">
                    <td th:text="${detalle.id}"></td>
                    <td th:text="${detalle.presupuesto != null ? detalle.presupuesto.id : 'Sin presupuesto'}"></td>
                    <td th:text="${detalle.material != null ? detalle.material.nombre : 'Sin material'}"></td>
                    <td th:text="${detalle.stock}"></td>
                    <td th:text="${detalle.subtotal}"></td>
                    <td>
                        <a class="btn btn-warning" th:href="@{/detallepresupuesto/form/{id}(id=${detalle.id})}">
                            Editar
                        </a>
                    </td>
                    <td>
                        <a class="btn btn-danger" th:href="@{/detallepresupuesto/eliminar/{id}(id=${detalle.id})}"
                           onclick="return confirm('¿Deseas eliminar este detalle?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
