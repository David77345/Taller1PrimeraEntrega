<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Detalle Presupuesto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container form-container">
        <div class="topbar">
            <h1 th:text="${titulo}">Formulario de Detalle Presupuesto</h1>
            <a class="btn btn-secondary" th:href="@{/detallepresupuesto/listar}">Volver</a>
        </div>

        <form th:action="@{/detallepresupuesto/form}" th:object="${detallePresupuesto}" method="post" class="form-card">
            <input type="hidden" th:field="*{id}">

            <label for="presupuesto">Presupuesto</label>
            <select id="presupuesto" th:field="*{presupuesto}">
                <option value="">Seleccione un presupuesto</option>
                <option th:each="presupuesto : ${presupuestos}"
                        th:value="${presupuesto.id}"
                        th:text="'Presupuesto #' + ${presupuesto.id}">
                </option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('presupuesto')}" th:errors="*{presupuesto}"></small>

            <label for="material">Material</label>
            <select id="material" th:field="*{material}">
                <option value="">Seleccione un material</option>
                <option th:each="material : ${materiales}"
                        th:value="${material.id}"
                        th:text="${material.nombre}">
                </option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('material')}" th:errors="*{material}"></small>

            <label for="stock">Stock</label>
            <input type="number" id="stock" th:field="*{stock}">
            <small class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>

            <label for="subtotal">Subtotal</label>
            <input type="number" step="0.01" id="subtotal" th:field="*{subtotal}">
            <small class="error" th:if="${#fields.hasErrors('subtotal')}" th:errors="*{subtotal}"></small>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</body>
</html>
