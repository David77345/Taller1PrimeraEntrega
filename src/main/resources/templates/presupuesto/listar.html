<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Presupuestos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1 th:text="${titulo}">Listado de Presupuestos</h1>
            <div>
                <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
                <a class="btn btn-primary" th:href="@{/presupuesto/form}">Nuevo Presupuesto</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Proyecto</th>
                    <th>Total</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="presupuesto : ${presupuestos}">
                    <td th:text="${presupuesto.id}"></td>
                    <td th:text="${presupuesto.proyecto != null ? presupuesto.proyecto.nombre : 'Sin proyecto'}"></td>
                    <td th:text="${presupuesto.total}"></td>
                    <td>
                        <a class="btn btn-warning" th:href="@{/presupuesto/form/{id}(id=${presupuesto.id})}">
                            Editar
                        </a>
                    </td>
                    <td>
                        <a class="btn btn-danger" th:href="@{/presupuesto/eliminar/{id}(id=${presupuesto.id})}"
                           onclick="return confirm('¿Deseas eliminar este presupuesto?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
