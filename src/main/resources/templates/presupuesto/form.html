<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Presupuesto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container form-container">
        <div class="topbar">
            <h1 th:text="${titulo}">Formulario de Presupuesto</h1>
            <a class="btn btn-secondary" th:href="@{/presupuesto/listar}">Volver</a>
        </div>

        <form th:action="@{/presupuesto/form}" th:object="${presupuesto}" method="post" class="form-card">
            <input type="hidden" th:field="*{id}">

            <label for="proyecto">Proyecto</label>
            <select id="proyecto" th:field="*{proyecto}">
                <option value="">Seleccione un proyecto</option>
                <option th:each="proyecto : ${proyectos}"
                        th:value="${proyecto.id}"
                        th:text="${proyecto.nombre}">
                </option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('proyecto')}" th:errors="*{proyecto}"></small>

            <label for="total">Total</label>
            <input type="number" step="0.01" id="total" th:field="*{total}">
            <small class="error" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></small>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</body>
</html>
