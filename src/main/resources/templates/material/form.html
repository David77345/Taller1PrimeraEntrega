<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Material</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container form-container">
        <div class="topbar">
            <h1 th:text="${titulo}">Formulario de Material</h1>
            <a class="btn btn-secondary" th:href="@{/material/listar}">Volver</a>
        </div>

        <form th:action="@{/material/form}" th:object="${material}" method="post" class="form-card">
            <input type="hidden" th:field="*{id}">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}">
            <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}"></textarea>
            <small class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>

            <label for="valorUnitario">Valor unitario</label>
            <input type="number" step="0.01" id="valorUnitario" th:field="*{valorUnitario}">
            <small class="error" th:if="${#fields.hasErrors('valorUnitario')}" th:errors="*{valorUnitario}"></small>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</body>
</html>
