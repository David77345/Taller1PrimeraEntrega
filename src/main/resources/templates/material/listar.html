<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Materiales</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1 th:text="${titulo}">Listado de Materiales</h1>
            <div>
                <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
                <a class="btn btn-primary" th:href="@{/material/form}">Nuevo Material</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Valor Unitario</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="material : ${materiales}">
                    <td th:text="${material.id}"></td>
                    <td th:text="${material.nombre}"></td>
                    <td th:text="${material.descripcion}"></td>
                    <td th:text="${material.valorUnitario}"></td>
                    <td>
                        <a class="btn btn-warning" th:href="@{/material/form/{id}(id=${material.id})}">
                            Editar
                        </a>
                    </td>
                    <td>
                        <a class="btn btn-danger" th:href="@{/material/eliminar/{id}(id=${material.id})}"
                           onclick="return confirm('¿Deseas eliminar este material?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
